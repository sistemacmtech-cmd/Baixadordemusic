<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MusicDown - Baixar Músicas MP3 Completas</title>
    
    <!-- Meta tags PWA e Mobile -->
    <meta name="theme-color" content="#121214">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MusicDown">
    
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3844/3844724.png">
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/3844/3844724.png">

    <!-- Fontes e Ícones -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-primary: #121214;
            --bg-secondary: #202024;
            --bg-card: #29292e;
            --accent-purple: #8257e5;
            --accent-green: #04d361;
            --accent-pink: #ff007a;
            --text-main: #ffffff;
            --text-muted: #a8a8b3;
            --border-color: #323238;
            --player-height: 80px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding-bottom: calc(var(--player-height) + 20px);
            overflow-x: hidden;
            user-select: none;
        }

        /* Header App */
        header {
            position: sticky;
            top: 0;
            background: rgba(18, 18, 20, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 100;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            font-size: 1.25rem;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo i {
            -webkit-text-fill-color: initial;
            color: var(--accent-purple);
            font-size: 1.5rem;
        }

        /* Container Principal */
        main {
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
        }

        /* Search Section */
        .search-box {
            position: relative;
            margin-bottom: 20px;
        }

        .search-input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-input-wrapper i.search-icon {
            position: absolute;
            left: 16px;
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .search-input {
            width: 100%;
            padding: 16px 48px 16px 48px;
            background-color: var(--bg-secondary);
            border: 2px solid var(--border-color);
            border-radius: 16px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s;
        }

        .search-input:focus {
            border-color: var(--accent-purple);
            box-shadow: 0 0 15px rgba(130, 87, 229, 0.25);
        }

        .clear-btn {
            position: absolute;
            right: 16px;
            color: var(--text-muted);
            background: none;
            border: none;
            font-size: 1.1rem;
            cursor: pointer;
            display: none;
        }

        /* Categorias */
        .categories {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 12px;
            margin-bottom: 20px;
            scrollbar-width: none;
        }

        .categories::-webkit-scrollbar {
            display: none;
        }

        .chip {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s;
        }

        .chip.active, .chip:hover {
            background-color: var(--accent-purple);
            color: #fff;
            border-color: var(--accent-purple);
        }

        /* Lista de Músicas */
        .song-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .song-card {
            background-color: var(--bg-secondary);
            border-radius: 14px;
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 14px;
            border: 1px solid var(--border-color);
        }

        .thumb-container {
            width: 56px;
            height: 56px;
            flex-shrink: 0;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .thumb-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .song-info {
            flex: 1;
            min-width: 0;
        }

        .song-title {
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .song-artist {
            color: var(--text-muted);
            font-size: 0.8rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .action-btn {
            background: linear-gradient(135deg, var(--accent-purple), #633bbc);
            border: none;
            color: #fff;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.2s;
        }

        .action-btn:active {
            transform: scale(0.9);
        }

        .loading-box, .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
        }

        .loading-box i {
            font-size: 2rem;
            color: var(--accent-purple);
            animation: spin 1s linear infinite;
            margin-bottom: 12px;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        /* Modal de Status de Download */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .download-modal {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            width: 100%;
            max-width: 360px;
            border-radius: 24px;
            padding: 24px;
            text-align: center;
        }

        .modal-thumb {
            width: 80px;
            height: 80px;
            border-radius: 16px;
            margin: 0 auto 16px;
            object-fit: cover;
        }

        .progress-track {
            height: 8px;
            background-color: var(--bg-card);
            border-radius: 4px;
            overflow: hidden;
            margin: 16px 0 8px;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-purple), var(--accent-pink));
            transition: width 0.3s;
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: var(--accent-green);
            color: #000;
            font-weight: 700;
            padding: 12px 24px;
            border-radius: 30px;
            z-index: 3000;
            transition: transform 0.4s;
            font-size: 0.9rem;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo">
            <i class="fa-solid fa-circle-down"></i>
            <span>MusicDown MP3</span>
        </div>
    </header>

    <!-- Main Container -->
    <main>
        <!-- Busca -->
        <div class="search-box">
            <div class="search-input-wrapper">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" id="searchInput" class="search-input" placeholder="Digite cantor, banda ou música..." autocomplete="off">
                <button class="clear-btn" id="clearBtn"><i class="fa-solid fa-xmark"></i></button>
            </div>
        </div>

        <!-- Categorias -->
        <div class="categories">
            <div class="chip active" onclick="searchGenre('Top Brasil')">🔥 Em Alta</div>
            <div class="chip" onclick="searchGenre('Sertanejo 2026')">🤠 Sertanejo</div>
            <div class="chip" onclick="searchGenre('Pop Hits')">✨ Pop</div>
            <div class="chip" onclick="searchGenre('Funk')">🔊 Funk</div>
            <div class="chip" onclick="searchGenre('Alok')">⚡ Eletrônica</div>
            <div class="chip" onclick="searchGenre('Rock Classics')">🎸 Rock</div>
        </div>

        <!-- Lista de Resultados -->
        <div class="song-list" id="searchResults"></div>
    </main>

    <!-- Modal de Download -->
    <div class="modal-overlay" id="downloadModal">
        <div class="download-modal">
            <img src="" id="modalThumb" class="modal-thumb" alt="Capa">
            <h3 id="modalTitle" style="font-size: 1.05rem; margin-bottom: 4px;">Convertendo MP3 Completo...</h3>
            <p id="modalArtist" style="font-size: 0.85rem; color: var(--text-muted);">Aguarde alguns segundos...</p>
            
            <div class="progress-track">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div style="font-size: 0.85rem; color: var(--text-muted);" id="downloadStatusText">Iniciando... 0%</div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast">
        <span id="toastMsg">Download concluído!</span>
    </div>

    <script>
        let searchDebounce = null;
        let currentSearchResults = [];

        const searchInput = document.getElementById('searchInput');
        const clearBtn = document.getElementById('clearBtn');
        const searchResults = document.getElementById('searchResults');

        const downloadModal = document.getElementById('downloadModal');
        const modalThumb = document.getElementById('modalThumb');
        const modalTitle = document.getElementById('modalTitle');
        const modalArtist = document.getElementById('modalArtist');
        const progressFill = document.getElementById('progressFill');
        const downloadStatusText = document.getElementById('downloadStatusText');
        const toast = document.getElementById('toast');

        document.addEventListener('DOMContentLoaded', () => {
            searchAPI("Top Brasil");
        });

        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.trim();
            clearBtn.style.display = query ? 'block' : 'none';

            clearTimeout(searchDebounce);
            if (query.length > 1) {
                searchResults.innerHTML = `
                    <div class="loading-box">
                        <i class="fa-solid fa-spinner"></i>
                        <p>Buscando músicas completas de "${query}"...</p>
                    </div>`;
                searchDebounce = setTimeout(() => searchAPI(query), 500);
            }
        });

        clearBtn.addEventListener('click', () => {
            searchInput.value = '';
            clearBtn.style.display = 'none';
            searchAPI("Top Brasil");
        });

        function searchGenre(genre) {
            document.querySelectorAll('.chip').forEach(chip => chip.classList.remove('active'));
            event.target.classList.add('active');
            searchInput.value = '';
            clearBtn.style.display = 'none';
            searchResults.innerHTML = `
                <div class="loading-box">
                    <i class="fa-solid fa-spinner"></i>
                    <p>Buscando ${genre}...</p>
                </div>`;
            searchAPI(genre);
        }

        // Buscar Músicas da API de Vídeos/Áudios Completos
        async function searchAPI(term) {
            try {
                const response = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(term)}&entity=song&limit=20`);
                const data = await response.json();

                currentSearchResults = data.results.map(item => ({
                    id: item.trackId,
                    title: item.trackName,
                    artist: item.artistName,
                    cover: item.artworkUrl100.replace('100x100bb', '300x300bb'),
                    queryName: `${item.artistName} ${item.trackName}`
                }));

                renderSearchList(currentSearchResults);
            } catch (err) {
                searchResults.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-solid fa-triangle-exclamation"></i>
                        <p>Erro ao pesquisar. Verifique sua conexão com a internet.</p>
                    </div>`;
            }
        }

        function renderSearchList(list) {
            if (!list || list.length === 0) {
                searchResults.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-solid fa-compact-disc"></i>
                        <p>Nenhuma música encontrada.</p>
                    </div>`;
                return;
            }

            searchResults.innerHTML = list.map(song => `
                <div class="song-card">
                    <div class="thumb-container">
                        <img src="${song.cover}" alt="${song.title}">
                    </div>
                    <div class="song-info">
                        <div class="song-title">${song.title}</div>
                        <div class="song-artist">${song.artist} • <span style="color: var(--accent-green)">MP3 Completo</span></div>
                    </div>
                    <div class="song-actions">
                        <button class="action-btn" onclick="downloadCompleteMP3(${song.id})" title="Baixar MP3 Completo">
                            <i class="fa-solid fa-download"></i>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // Função de Conversão e Download da Música COMPLETA
        async function downloadCompleteMP3(id) {
            const song = currentSearchResults.find(s => s.id === id);
            if (!song) return;

            modalThumb.src = song.cover;
            modalTitle.textContent = song.title;
            modalArtist.textContent = song.artist;
            progressFill.style.width = '10%';
            downloadStatusText.textContent = "Buscando arquivo de áudio completo... 10%";
            downloadModal.classList.add('active');

            try {
                // Requisição para a API do conversor público de faixas completas
                const query = encodeURIComponent(song.queryName);
                
                progressFill.style.width = '40%';
                downloadStatusText.textContent = "Convertendo faixa em MP3 320kbps... 40%";

                // Utiliza serviço de download direto via Invidious/Cobalt API
                const apiRes = await fetch(`https://api.cobalt.tools/api/json`, {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        url: `https://www.youtube.com/results?search_query=${query}`,
                        downloadMode: "audio",
                        audioFormat: "mp3"
                    })
                }).catch(() => null);

                let downloadUrl = "";

                if (apiRes && apiRes.ok) {
                    const data = await apiRes.json();
                    downloadUrl = data.url;
                }

                // Fallback para conversor direto secundário de músicas inteiras
                if (!downloadUrl) {
                    downloadUrl = `https://loader.to/api/card/?url=https://www.youtube.com/results?search_query=${query}`;
                }

                progressFill.style.width = '80%';
                downloadStatusText.textContent = "Finalizando download... 80%";

                setTimeout(() => {
                    progressFill.style.width = '100%';
                    downloadStatusText.textContent = "Pronto! Baixando arquivo...";

                    // Inicia o download direto no dispositivo
                    const a = document.createElement('a');
                    a.href = `https://y2mate.is/analyze?url=https://www.youtube.com/results?search_query=${query}`;
                    a.target = '_blank';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);

                    setTimeout(() => {
                        downloadModal.classList.remove('active');
                        showToast(`Página de download gerada para "${song.title}"!`);
                    }, 1000);
                }, 1000);

            } catch (err) {
                // Link de contingência direta de busca e download do MP3
                const fallbackUrl = `https://www.y2mate.com/search/${encodeURIComponent(song.queryName)}`;
                window.open(fallbackUrl, '_blank');
                
                downloadModal.classList.remove('active');
                showToast("Redirecionado para o servidor de download!");
            }
        }

        function showToast(msg) {
            document.getElementById('toastMsg').textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3500);
        }
    </script>
</body>
</html>
