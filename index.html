<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Music Sistem - Player Local</title>
    
    <!-- PWA Settings -->
    <meta name="theme-color" content="#121212">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Music Sistem">
    
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3388/3388902.png">
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/3388/3388902.png">

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --spotify-black: #121212;
            --spotify-darkgray: #181818;
            --spotify-lightgray: #282828;
            --spotify-green: #1db954;
            --spotify-green-hover: #1ed760;
            --text-main: #ffffff;
            --text-sub: #b3b3b3;
            --player-height: 95px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--spotify-black);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding-bottom: calc(var(--player-height) + 20px);
            overflow-x: hidden;
            user-select: none;
        }

        /* Header */
        header {
            position: sticky;
            top: 0;
            background: rgba(18, 18, 18, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 100;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            font-size: 1.3rem;
            color: var(--text-main);
            letter-spacing: -0.5px;
        }

        .logo i {
            color: var(--spotify-green);
            font-size: 1.6rem;
        }

        /* Main Container */
        main {
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
        }

        /* Botão para Adicionar Músicas */
        .upload-section {
            background: linear-gradient(135deg, #282828, #181818);
            border: 2px dashed rgba(255,255,255,0.15);
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            margin-bottom: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .upload-section:hover {
            border-color: var(--spotify-green);
            background: rgba(29, 185, 84, 0.05);
        }

        .upload-section i {
            font-size: 2.5rem;
            color: var(--spotify-green);
            margin-bottom: 10px;
        }

        .upload-section h3 {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .upload-section p {
            font-size: 0.8rem;
            color: var(--text-sub);
        }

        #fileInput {
            display: none;
        }

        /* Equalizador Gráfico Card */
        .equalizer-box {
            background-color: var(--spotify-darkgray);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 24px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .eq-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .eq-sliders {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            text-align: center;
        }

        .eq-control {
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 0.75rem;
            color: var(--text-sub);
        }

        .eq-control input[type="range"] {
            -webkit-appearance: slider-vertical;
            width: 100%;
            height: 80px;
            accent-color: var(--spotify-green);
            cursor: pointer;
        }

        /* Playlist / Lista de Músicas */
        .section-title {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 14px;
            letter-spacing: -0.3px;
        }

        .song-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .song-card {
            background-color: var(--spotify-darkgray);
            border-radius: 8px;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            gap: 14px;
            transition: background-color 0.2s;
            cursor: pointer;
        }

        .song-card:hover, .song-card.active {
            background-color: var(--spotify-lightgray);
        }

        .song-card.active .song-title {
            color: var(--spotify-green);
        }

        .thumb-placeholder {
            width: 48px;
            height: 48px;
            background-color: #333;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-sub);
            flex-shrink: 0;
            font-size: 1.1rem;
        }

        .song-info {
            flex: 1;
            min-width: 0;
        }

        .song-title {
            font-weight: 600;
            font-size: 0.92rem;
            margin-bottom: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .song-artist {
            color: var(--text-sub);
            font-size: 0.8rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .song-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .whatsapp-share-btn {
            background: none;
            border: none;
            color: #25d366;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 6px;
            transition: transform 0.2s;
        }

        .whatsapp-share-btn:hover {
            transform: scale(1.15);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-sub);
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 12px;
            opacity: 0.4;
        }

        /* Player Fixo Inferior */
        .player-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: var(--player-height);
            background-color: #181818;
            border-top: 1px solid rgba(255,255,255,0.1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 10px 16px;
            z-index: 1000;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.5);
            display: none;
        }

        .player-main {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .player-left {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
            flex: 1;
        }

        .player-thumb {
            width: 42px;
            height: 42px;
            background: #333;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            flex-shrink: 0;
        }

        .player-text {
            min-width: 0;
        }

        .player-title {
            font-size: 0.85rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-artist {
            font-size: 0.75rem;
            color: var(--text-sub);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-controls {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .ctrl-btn {
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 1.1rem;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .ctrl-btn:active {
            transform: scale(0.9);
        }

        .play-pause-main {
            width: 38px;
            height: 38px;
            background-color: #fff;
            color: #000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.95rem;
        }

        /* Seek Bar */
        .progress-container {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .time-text {
            font-size: 0.65rem;
            color: var(--text-sub);
            width: 28px;
        }

        .seek-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 4px;
            border-radius: 2px;
            background: #4d4d4d;
            outline: none;
            cursor: pointer;
        }

        .seek-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo">
            <i class="fa-solid fa-compact-disc"></i>
            <span>Music Sistem</span>
        </div>
    </header>

    <!-- Main Section -->
    <main>
        <!-- Botão Selecionar Músicas -->
        <div class="upload-section" onclick="document.getElementById('fileInput').click()">
            <i class="fa-solid fa-folder-open"></i>
            <h3>Adicionar Músicas do Aparelho</h3>
            <p>Toque para selecionar arquivos MP3, WAV ou AAC</p>
            <input type="file" id="fileInput" accept="audio/*" multiple>
        </div>

        <!-- Equalizador Gráfico -->
        <div class="equalizer-box">
            <div class="eq-header">
                <span><i class="fa-solid fa-sliders"></i> Equalizador Gráfico</span>
            </div>
            <div class="eq-sliders">
                <div class="eq-control">
                    <input type="range" id="eqBass" min="-20" max="20" value="0" step="1">
                    <span>Graves (Bass)</span>
                </div>
                <div class="eq-control">
                    <input type="range" id="eqMid" min="-20" max="20" value="0" step="1">
                    <span>Médios (Mid)</span>
                </div>
                <div class="eq-control">
                    <input type="range" id="eqTreble" min="-20" max="20" value="0" step="1">
                    <span>Agudos (Treble)</span>
                </div>
            </div>
        </div>

        <div class="section-title">Sua Playlist Local</div>
        
        <!-- Playlist -->
        <div class="song-list" id="playlistContainer">
            <div class="empty-state">
                <i class="fa-solid fa-music"></i>
                <p>Nenhuma música carregada ainda.<br>Toque na caixa acima para escolher.</p>
            </div>
        </div>
    </main>

    <!-- Player Fixo -->
    <div class="player-bar" id="playerBar">
        <div class="player-main">
            <div class="player-left">
                <div class="player-thumb">
                    <i class="fa-solid fa-music"></i>
                </div>
                <div class="player-text">
                    <div class="player-title" id="playerTitle">Nome da Música</div>
                    <div class="player-artist" id="playerArtist">Artista Desconhecido</div>
                </div>
            </div>
            <div class="player-controls">
                <button class="ctrl-btn" onclick="prevSong()" title="Anterior"><i class="fa-solid fa-backward-step"></i></button>
                <button class="ctrl-btn play-pause-main" id="playPauseBtn" onclick="togglePlay()"><i class="fa-solid fa-play"></i></button>
                <button class="ctrl-btn" onclick="nextSong()" title="Próxima"><i class="fa-solid fa-forward-step"></i></button>
            </div>
        </div>
        <div class="progress-container">
            <span class="time-text" id="currentTime">0:00</span>
            <input type="range" class="seek-slider" id="seekSlider" value="0" min="0" max="100">
            <span class="time-text" id="totalDuration">0:00</span>
        </div>
    </div>

    <!-- Elemento de Áudio HTML5 -->
    <audio id="audioElement" crossorigin="anonymous"></audio>

    <script>
        let playlist = [];
        let currentIndex = 0;
        let audioCtx, sourceNode, bassFilter, midFilter, trebleFilter;
        let isAudioInit = false;

        const fileInput = document.getElementById('fileInput');
        const playlistContainer = document.getElementById('playlistContainer');
        const audioElement = document.getElementById('audioElement');
        const playerBar = document.getElementById('playerBar');
        
        const playerTitle = document.getElementById('playerTitle');
        const playerArtist = document.getElementById('playerArtist');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const seekSlider = document.getElementById('seekSlider');
        const currentTimeEl = document.getElementById('currentTime');
        const totalDurationEl = document.getElementById('totalDuration');

        // Inicializar Equalizador Web Audio API
        function initEqualizer() {
            if (isAudioInit) return;
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                sourceNode = audioCtx.createMediaElementSource(audioElement);

                // Filtro de Graves (Lowpass/Lowshelf)
                bassFilter = audioCtx.createBiquadFilter();
                bassFilter.type = 'lowshelf';
                bassFilter.frequency.setValueAtTime(250, audioCtx.currentTime);

                // Filtro de Médios (Peaking)
                midFilter = audioCtx.createBiquadFilter();
                midFilter.type = 'peaking';
                midFilter.frequency.setValueAtTime(1500, audioCtx.currentTime);
                midFilter.Q.setValueAtTime(1, audioCtx.currentTime);

                // Filtro de Agudos (Highshelf)
                trebleFilter = audioCtx.createBiquadFilter();
                trebleFilter.type = 'highshelf';
                trebleFilter.frequency.setValueAtTime(4000, audioCtx.currentTime);

                // Conectar os nós de áudio
                sourceNode.connect(bassFilter);
                bassFilter.connect(midFilter);
                midFilter.connect(trebleFilter);
                trebleFilter.connect(audioCtx.destination);

                isAudioInit = true;
            } catch (e) {
                console.log("Equalizador não suportado neste navegador.");
            }
        }

        // Controladores do Equalizador
        document.getElementById('eqBass').addEventListener('input', (e) => {
            if (bassFilter) bassFilter.gain.value = parseFloat(e.target.value);
        });
        document.getElementById('eqMid').addEventListener('input', (e) => {
            if (midFilter) midFilter.gain.value = parseFloat(e.target.value);
        });
        document.getElementById('eqTreble').addEventListener('input', (e) => {
            if (trebleFilter) trebleFilter.gain.value = parseFloat(e.target.value);
        });

        // Carregar arquivos locais
        fileInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;

            files.forEach(file => {
                let nameWithoutExt = file.name.replace(/\.[^/.]+$/, "");
                let parts = nameWithoutExt.split('-');
                let artist = parts.length > 1 ? parts[0].trim() : "Música Local";
                let title = parts.length > 1 ? parts.slice(1).join('-').trim() : nameWithoutExt;

                playlist.push({
                    title: title,
                    artist: artist,
                    url: URL.createObjectURL(file)
                });
            });

            renderPlaylist();
            if (audioElement.paused && playlist.length === files.length) {
                playSong(playlist.length - files.length);
            }
        });

        function renderPlaylist() {
            if (playlist.length === 0) return;

            playlistContainer.innerHTML = playlist.map((song, index) => `
                <div class="song-card ${index === currentIndex ? 'active' : ''}" onclick="playSong(${index})">
                    <div class="thumb-placeholder">
                        <i class="fa-solid fa-music"></i>
                    </div>
                    <div class="song-info">
                        <div class="song-title">${song.title}</div>
                        <div class="song-artist">${song.artist}</div>
                    </div>
                    <div class="song-actions">
                        <button class="whatsapp-share-btn" onclick="shareWhatsApp(event, '${song.title}', '${song.artist}')" title="Compartilhar no WhatsApp">
                            <i class="fa-brands fa-whatsapp"></i>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function playSong(index) {
            if (index < 0 || index >= playlist.length) return;
            currentIndex = index;
            const song = playlist[currentIndex];

            initEqualizer();
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            audioElement.src = song.url;
            playerTitle.textContent = song.title;
            playerArtist.textContent = song.artist;

            playerBar.style.display = 'flex';
            audioElement.play();
            updatePlayIcon(true);
            renderPlaylist();
        }

        function togglePlay() {
            if (!audioElement.src) return;
            initEqualizer();
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            if (audioElement.paused) {
                audioElement.play();
                updatePlayIcon(true);
            } else {
                audioElement.pause();
                updatePlayIcon(false);
            }
        }

        function updatePlayIcon(isPlaying) {
            playPauseBtn.innerHTML = `<i class="fa-solid ${isPlaying ? 'fa-pause' : 'fa-play'}"></i>`;
        }

        function nextSong() {
            if (playlist.length === 0) return;
            let next = (currentIndex + 1) % playlist.length;
            playSong(next);
        }

        function prevSong() {
            if (playlist.length === 0) return;
            let prev = (currentIndex - 1 + playlist.length) % playlist.length;
            playSong(prev);
        }

        // Compartilhar via WhatsApp
        function shareWhatsApp(event, title, artist) {
            event.stopPropagation(); // Evita tocar a música ao clicar no botão de share
            const text = encodeURIComponent(`Estou ouvindo "${title}" de ${artist} no Music Sistem! 🎶🎧`);
            const whatsappUrl = `https://api.whatsapp.com/send?text=${text}`;
            window.open(whatsappUrl, '_blank');
        }

        // Eventos de Áudio
        audioElement.addEventListener('timeupdate', () => {
            if (!isNaN(audioElement.duration)) {
                const progress = (audioElement.currentTime / audioElement.duration) * 100;
                seekSlider.value = progress;
                currentTimeEl.textContent = formatTime(audioElement.currentTime);
                totalDurationEl.textContent = formatTime(audioElement.duration);
            }
        });

        audioElement.addEventListener('ended', () => {
            nextSong();
        });

        seekSlider.addEventListener('input', () => {
            if (!isNaN(audioElement.duration)) {
                audioElement.currentTime = (seekSlider.value / 100) * audioElement.duration;
            }
        });

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }
    </script>
</body>
</html>
