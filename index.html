<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MusicDown - Baixar Músicas MP3</title>
    
    <!-- Meta tags PWA e Mobile -->
    <meta name="theme-color" content="#121214">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MusicDown">
    <meta name="description" content="Baixe suas músicas e áudios favoritos em MP3 para o seu celular com qualidade!">
    
    <!-- Ícone Web App -->
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3844/3844724.png">
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/3844/3844724.png">
    
    <!-- Manifest PWA Dinâmico -->
    <script>
        const manifestData = {
            "name": "MusicDown - Downloader MP3",
            "short_name": "MusicDown",
            "start_url": "./",
            "display": "standalone",
            "background_color": "#121214",
            "theme_color": "#8257e5",
            "icons": [{
                "src": "https://cdn-icons-png.flaticon.com/512/3844/3844724.png",
                "sizes": "512x512",
                "type": "image/png",
                "purpose": "any maskable"
            }]
        };
        const stringManifest = JSON.stringify(manifestData);
        const blob = new Blob([stringManifest], {type: 'application/json'});
        const manifestURL = URL.createObjectURL(blob);
        const link = document.createElement('link');
        link.rel = 'manifest';
        link.href = manifestURL;
        document.head.appendChild(link);
    </script>

    <!-- Fontes e Ícones -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-primary: #121214;
            --bg-secondary: #202024;
            --bg-card: #29292e;
            --accent-purple: #8257e5;
            --accent-green: #04d361;
            --accent-pink: #ff007a;
            --text-main: #ffffff;
            --text-muted: #a8a8b3;
            --border-color: #323238;
            --player-height: 80px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding-bottom: calc(var(--player-height) + 20px);
            overflow-x: hidden;
            user-select: none;
        }

        /* Header App */
        header {
            position: sticky;
            top: 0;
            background: rgba(18, 18, 20, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 100;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            font-size: 1.25rem;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo i {
            -webkit-text-fill-color: initial;
            color: var(--accent-purple);
            font-size: 1.5rem;
        }

        .btn-pwa-install {
            background: rgba(130, 87, 229, 0.2);
            border: 1px solid var(--accent-purple);
            color: #fff;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .btn-pwa-install:active {
            transform: scale(0.95);
        }

        /* Container Principal */
        main {
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
        }

        /* Search Section */
        .search-box {
            position: relative;
            margin-bottom: 24px;
        }

        .search-input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-input-wrapper i.search-icon {
            position: absolute;
            left: 16px;
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .search-input {
            width: 100%;
            padding: 16px 48px 16px 48px;
            background-color: var(--bg-secondary);
            border: 2px solid var(--border-color);
            border-radius: 16px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s;
        }

        .search-input:focus {
            border-color: var(--accent-purple);
            box-shadow: 0 0 15px rgba(130, 87, 229, 0.25);
        }

        .clear-btn {
            position: absolute;
            right: 16px;
            color: var(--text-muted);
            background: none;
            border: none;
            font-size: 1.1rem;
            cursor: pointer;
            display: none;
        }

        /* Categorias/Tags */
        .categories {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 12px;
            margin-bottom: 20px;
            scrollbar-width: none;
        }

        .categories::-webkit-scrollbar {
            display: none;
        }

        .chip {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s;
        }

        .chip.active, .chip:hover {
            background-color: var(--accent-purple);
            color: #fff;
            border-color: var(--accent-purple);
        }

        /* Tabs (Resultados / Baixadas) */
        .tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .tab-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.95rem;
            font-weight: 600;
            padding: 8px 12px;
            cursor: pointer;
            position: relative;
        }

        .tab-btn.active {
            color: #fff;
        }

        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: -9px;
            left: 0;
            width: 100%;
            height: 3px;
            background-color: var(--accent-purple);
            border-radius: 3px 3px 0 0;
        }

        /* Lista de Músicas */
        .song-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .song-card {
            background-color: var(--bg-secondary);
            border-radius: 14px;
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 14px;
            border: 1px solid var(--border-color);
            transition: transform 0.2s, background-color 0.2s;
        }

        .song-card:active {
            transform: scale(0.98);
        }

        .thumb-container {
            position: relative;
            width: 56px;
            height: 56px;
            flex-shrink: 0;
            border-radius: 10px;
            overflow: hidden;
        }

        .thumb-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .play-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .song-card:hover .play-overlay, .song-card.playing .play-overlay {
            opacity: 1;
        }

        .song-info {
            flex: 1;
            min-width: 0;
        }

        .song-title {
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .song-artist {
            color: var(--text-muted);
            font-size: 0.8rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .song-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .action-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .action-btn:hover {
            background-color: var(--accent-purple);
            border-color: var(--accent-purple);
            color: #fff;
        }

        .action-btn.download-btn {
            background: linear-gradient(135deg, var(--accent-purple), #633bbc);
            border: none;
            color: #fff;
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 12px;
            opacity: 0.5;
        }

        /* Player Fixo Flutuante */
        .mini-player {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 32px);
            max-width: 560px;
            height: var(--player-height);
            background: rgba(32, 32, 36, 0.95);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 10px 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            z-index: 1000;
            display: none;
        }

        .player-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .player-track-info {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
            flex: 1;
        }

        .player-thumb {
            width: 44px;
            height: 44px;
            border-radius: 8px;
            object-fit: cover;
        }

        .player-text {
            min-width: 0;
        }

        .player-title {
            font-size: 0.85rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-artist {
            font-size: 0.75rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .play-pause-btn {
            background-color: var(--accent-purple);
            color: #fff;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            cursor: pointer;
        }

        /* Barra de Progresso do Áudio */
        .progress-bar-container {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 4px;
        }

        .time-text {
            font-size: 0.65rem;
            color: var(--text-muted);
            width: 28px;
        }

        .seek-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 4px;
            border-radius: 2px;
            background: var(--bg-card);
            outline: none;
            cursor: pointer;
        }

        .seek-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--accent-purple);
            cursor: pointer;
        }

        /* Modal de Download */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .download-modal {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            width: 100%;
            max-width: 360px;
            border-radius: 24px;
            padding: 24px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            transform: scale(0.9);
            transition: transform 0.3s;
        }

        .modal-overlay.active .download-modal {
            transform: scale(1);
        }

        .modal-thumb {
            width: 80px;
            height: 80px;
            border-radius: 16px;
            margin: 0 auto 16px;
            object-fit: cover;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        .download-progress-box {
            margin: 20px 0;
        }

        .progress-track {
            height: 8px;
            background-color: var(--bg-card);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-purple), var(--accent-pink));
            transition: width 0.2s;
        }

        .download-status-text {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .modal-cancel-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 24px;
            border-radius: 12px;
            font-size: 0.9rem;
            cursor: pointer;
            margin-top: 10px;
        }

        /* Notificação Toast */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: var(--accent-green);
            color: #000;
            font-weight: 700;
            padding: 12px 24px;
            border-radius: 30px;
            box-shadow: 0 10px 20px rgba(4, 211, 97, 0.3);
            z-index: 3000;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo">
            <i class="fa-solid fa-circle-down"></i>
            <span>MusicDown</span>
        </div>
        <button class="btn-pwa-install" id="pwaInstallBtn" style="display: none;">
            <i class="fa-solid fa-download"></i> Instalar App
        </button>
    </header>

    <!-- Main Container -->
    <main>
        <!-- Search -->
        <div class="search-box">
            <div class="search-input-wrapper">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" id="searchInput" class="search-input" placeholder="Digite cantor, banda ou música..." autocomplete="off">
                <button class="clear-btn" id="clearBtn"><i class="fa-solid fa-xmark"></i></button>
            </div>
        </div>

        <!-- Categorias -->
        <div class="categories">
            <div class="chip active" onclick="filterGenre('todos')">🔥 Em alta</div>
            <div class="chip" onclick="filterGenre('sertanejo')">🤠 Sertanejo</div>
            <div class="chip" onclick="filterGenre('pop')">✨ Pop</div>
            <div class="chip" onclick="filterGenre('funk')">🔊 Funk / Trap</div>
            <div class="chip" onclick="filterGenre('eletronica')">⚡ Eletrônica</div>
            <div class="chip" onclick="filterGenre('rock')">🎸 Rock</div>
        </div>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab-btn active" id="tabSearch" onclick="switchTab('search')">Resultados</button>
            <button class="tab-btn" id="tabLibrary" onclick="switchTab('library')">Baixadas <span id="downloadCount">(0)</span></button>
        </div>

        <!-- Lista de Músicas (Resultados da Busca) -->
        <div class="song-list" id="searchResults"></div>

        <!-- Lista de Músicas (Biblioteca Baixadas) -->
        <div class="song-list" id="libraryResults" style="display: none;"></div>
    </main>

    <!-- Player de Áudio Flutuante (Mini-Player) -->
    <div class="mini-player" id="miniPlayer">
        <div class="player-content">
            <div class="player-track-info">
                <img src="" id="playerThumb" class="player-thumb" alt="Capa">
                <div class="player-text">
                    <div class="player-title" id="playerTitle">Nome da Música</div>
                    <div class="player-artist" id="playerArtist">Artista</div>
                </div>
            </div>
            <div class="player-controls">
                <button class="play-pause-btn" id="playPauseBtn" onclick="togglePlay()">
                    <i class="fa-solid fa-play"></i>
                </button>
            </div>
        </div>
        <div class="progress-bar-container">
            <span class="time-text" id="currentTime">0:00</span>
            <input type="range" class="seek-slider" id="seekSlider" value="0" min="0" max="100">
            <span class="time-text" id="totalDuration">0:00</span>
        </div>
    </div>

    <!-- Modal de Download -->
    <div class="modal-overlay" id="downloadModal">
        <div class="download-modal">
            <img src="" id="modalThumb" class="modal-thumb" alt="Capa">
            <h3 id="modalTitle" style="font-size: 1.05rem; margin-bottom: 4px;">Convertendo Áudio...</h3>
            <p id="modalArtist" style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 12px;">Artista</p>
            
            <div class="download-progress-box">
                <div class="progress-track">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="download-status-text" id="downloadStatusText">Iniciando download MP3 (320kbps)... 0%</div>
            </div>

            <button class="modal-cancel-btn" onclick="cancelDownload()">Cancelar</button>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast">
        <i class="fa-solid fa-circle-check"></i>
        <span id="toastMsg">Download concluído!</span>
    </div>

    <!-- Elemento de Áudio Oculto -->
    <audio id="audioPlayer"></audio>

    <script>
        // Base de dados de exemplo com músicas em alta e URLs de áudio direto públicas/royalty-free
        const database = [
            {
                id: 1,
                title: "Mantra Beats (320kbps)",
                artist: "Lofi Vibes",
                genre: "pop",
                cover: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=200&auto=format&fit=crop&q=80",
                audioUrl: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3",
                size: "4.2 MB"
            },
            {
                id: 2,
                title: "Sertanejo Hits Top 2026",
                artist: "Marília & Gabriel",
                genre: "sertanejo",
                cover: "https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=200&auto=format&fit=crop&q=80",
                audioUrl: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3",
                size: "5.1 MB"
            },
            {
                id: 3,
                title: "Midnight City Synth",
                artist: "Electro Wave",
                genre: "eletronica",
                cover: "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=200&auto=format&fit=crop&q=80",
                audioUrl: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3",
                size: "3.8 MB"
            },
            {
                id: 4,
                title: "Funk Automotivo Heavy",
                artist: "DJ BASS BR",
                genre: "funk",
                cover: "https://images.unsplash.com/photo-1508700115892-45ecd05ae2ad?w=200&auto=format&fit=crop&q=80",
                audioUrl: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3",
                size: "4.8 MB"
            },
            {
                id: 5,
                title: "Rock Classics Remix",
                artist: "The Vintage Band",
                genre: "rock",
                cover: "https://images.unsplash.com/photo-1498038432885-c6f3f1b912ee?w=200&auto=format&fit=crop&q=80",
                audioUrl: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3",
                size: "6.0 MB"
            }
        ];

        // Estado da aplicação
        let currentTab = 'search';
        let currentFilter = 'todos';
        let downloadedSongs = JSON.parse(localStorage.getItem('downloaded_songs') || '[]');
        let currentPlayingId = null;
        let isDownloading = false;
        let downloadInterval = null;

        // Elementos DOM
        const searchInput = document.getElementById('searchInput');
        const clearBtn = document.getElementById('clearBtn');
        const searchResults = document.getElementById('searchResults');
        const libraryResults = document.getElementById('libraryResults');
        const downloadCountEl = document.getElementById('downloadCount');
        
        const audioPlayer = document.getElementById('audioPlayer');
        const miniPlayer = document.getElementById('miniPlayer');
        const playerThumb = document.getElementById('playerThumb');
        const playerTitle = document.getElementById('playerTitle');
        const playerArtist = document.getElementById('playerArtist');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const seekSlider = document.getElementById('seekSlider');
        const currentTimeEl = document.getElementById('currentTime');
        const totalDurationEl = document.getElementById('totalDuration');

        const downloadModal = document.getElementById('downloadModal');
        const modalThumb = document.getElementById('modalThumb');
        const modalTitle = document.getElementById('modalTitle');
        const modalArtist = document.getElementById('modalArtist');
        const progressFill = document.getElementById('progressFill');
        const downloadStatusText = document.getElementById('downloadStatusText');
        const toast = document.getElementById('toast');

        // Inicialização
        document.addEventListener('DOMContentLoaded', () => {
            renderSearchList(database);
            updateLibraryUI();
            setupAudioEvents();
            setupPWA();
        });

        // Eventos de Busca
        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            clearBtn.style.display = query ? 'block' : 'none';
            
            const filtered = database.filter(song => 
                song.title.toLowerCase().includes(query) || 
                song.artist.toLowerCase().includes(query)
            );
            
            renderSearchList(filtered);
        });

        clearBtn.addEventListener('click', () => {
            searchInput.value = '';
            clearBtn.style.display = 'none';
            renderSearchList(database);
        });

        // Filtro por Gênero
        function filterGenre(genre) {
            currentFilter = genre;
            document.querySelectorAll('.chip').forEach(chip => chip.classList.remove('active'));
            event.target.classList.add('active');

            if (genre === 'todos') {
                renderSearchList(database);
            } else {
                const filtered = database.filter(song => song.genre === genre);
                renderSearchList(filtered);
            }
        }

        // Alternar Abas (Busca / Baixadas)
        function switchTab(tab) {
            currentTab = tab;
            if (tab === 'search') {
                document.getElementById('tabSearch').classList.add('active');
                document.getElementById('tabLibrary').classList.remove('active');
                searchResults.style.display = 'flex';
                libraryResults.style.display = 'none';
            } else {
                document.getElementById('tabLibrary').classList.add('active');
                document.getElementById('tabSearch').classList.remove('active');
                searchResults.style.display = 'none';
                libraryResults.style.display = 'flex';
                renderLibraryList();
            }
        }

        // Renderizar Lista de Resultados
        function renderSearchList(list) {
            if (list.length === 0) {
                searchResults.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-solid fa-compact-disc"></i>
                        <p>Nenhuma música encontrada para sua busca.</p>
                    </div>`;
                return;
            }

            searchResults.innerHTML = list.map(song => {
                const isDownloaded = downloadedSongs.some(item => item.id === song.id);
                const isPlaying = currentPlayingId === song.id;

                return `
                    <div class="song-card ${isPlaying ? 'playing' : ''}">
                        <div class="thumb-container" onclick="playSong(${song.id})">
                            <img src="${song.cover}" alt="${song.title}">
                            <div class="play-overlay">
                                <i class="fa-solid ${isPlaying && !audioPlayer.paused ? 'fa-pause' : 'fa-play'}"></i>
                            </div>
                        </div>
                        <div class="song-info" onclick="playSong(${song.id})">
                            <div class="song-title">${song.title}</div>
                            <div class="song-artist">${song.artist} • <span style="color: var(--accent-green)">MP3</span></div>
                        </div>
                        <div class="song-actions">
                            <button class="action-btn download-btn" onclick="startDownload(${song.id})" title="Baixar MP3">
                                <i class="fa-solid ${isDownloaded ? 'fa-check' : 'fa-arrow-down'}"></i>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Renderizar Lista de Downloads Salvos
        function renderLibraryList() {
            if (downloadedSongs.length === 0) {
                libraryResults.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-solid fa-folder-open"></i>
                        <p>Você ainda não baixou nenhuma música.</p>
                    </div>`;
                return;
            }

            libraryResults.innerHTML = downloadedSongs.map(song => {
                const isPlaying = currentPlayingId === song.id;
                return `
                    <div class="song-card ${isPlaying ? 'playing' : ''}">
                        <div class="thumb-container" onclick="playSong(${song.id})">
                            <img src="${song.cover}" alt="${song.title}">
                            <div class="play-overlay">
                                <i class="fa-solid ${isPlaying && !audioPlayer.paused ? 'fa-pause' : 'fa-play'}"></i>
                            </div>
                        </div>
                        <div class="song-info" onclick="playSong(${song.id})">
                            <div class="song-title">${song.title}</div>
                            <div class="song-artist">${song.artist} • ${song.size || 'MP3'}</div>
                        </div>
                        <div class="song-actions">
                            <button class="action-btn" onclick="deleteSong(${song.id})" style="color: #ff5555;" title="Excluir">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Sistema de Reprodução de Áudio
        function playSong(id) {
            const song = database.find(s => s.id === id) || downloadedSongs.find(s => s.id === id);
            if (!song) return;

            if (currentPlayingId === id) {
                togglePlay();
                return;
            }

            currentPlayingId = id;
            audioPlayer.src = song.audioUrl;
            playerThumb.src = song.cover;
            playerTitle.textContent = song.title;
            playerArtist.textContent = song.artist;

            miniPlayer.style.display = 'flex';
            audioPlayer.play();
            updatePlayPauseIcon(true);
            refreshCardStates();
        }

        function togglePlay() {
            if (!audioPlayer.src) return;
            if (audioPlayer.paused) {
                audioPlayer.play();
                updatePlayPauseIcon(true);
            } else {
                audioPlayer.pause();
                updatePlayPauseIcon(false);
            }
            refreshCardStates();
        }

        function updatePlayPauseIcon(isPlaying) {
            playPauseBtn.innerHTML = `<i class="fa-solid ${isPlaying ? 'fa-pause' : 'fa-play'}"></i>`;
        }

        function refreshCardStates() {
            if (currentTab === 'search') renderSearchList(database);
            else renderLibraryList();
        }

        function setupAudioEvents() {
            audioPlayer.addEventListener('timeupdate', () => {
                if (!isNaN(audioPlayer.duration)) {
                    const progress = (audioPlayer.currentTime / audioPlayer.duration) * 100;
                    seekSlider.value = progress;
                    currentTimeEl.textContent = formatTime(audioPlayer.currentTime);
                    totalDurationEl.textContent = formatTime(audioPlayer.duration);
                }
            });

            audioPlayer.addEventListener('ended', () => {
                updatePlayPauseIcon(false);
                refreshCardStates();
            });

            seekSlider.addEventListener('input', () => {
                if (!isNaN(audioPlayer.duration)) {
                    const targetTime = (seekSlider.value / 100) * audioPlayer.duration;
                    audioPlayer.currentTime = targetTime;
                }
            });
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        // Sistema de Download Simulado + Download Direto do Arquivo MP3 Real
        function startDownload(id) {
            const song = database.find(s => s.id === id);
            if (!song) return;

            modalThumb.src = song.cover;
            modalTitle.textContent = song.title;
            modalArtist.textContent = song.artist;
            progressFill.style.width = '0%';
            downloadStatusText.textContent = "Conectando ao servidor MP3... 0%";
            downloadModal.classList.add('active');

            let progress = 0;
            isDownloading = true;

            downloadInterval = setInterval(() => {
                progress += Math.floor(Math.random() * 15) + 10;
                if (progress > 100) progress = 100;

                progressFill.style.width = `${progress}%`;
                downloadStatusText.textContent = `Convertendo e baixando... ${progress}%`;

                if (progress >= 100) {
                    clearInterval(downloadInterval);
                    finishDownload(song);
                }
            }, 300);
        }

        function finishDownload(song) {
            setTimeout(() => {
                downloadModal.classList.remove('active');
                
                // Salvar na biblioteca local se ainda não estiver
                if (!downloadedSongs.some(item => item.id === song.id)) {
                    downloadedSongs.push(song);
                    localStorage.setItem('downloaded_songs', JSON.stringify(downloadedSongs));
                    updateLibraryUI();
                }

                // Disparar Download Físico do Arquivo MP3 para o celular
                const a = document.createElement('a');
                a.href = song.audioUrl;
                a.download = `${song.artist} - ${song.title}.mp3`;
                a.target = '_blank';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);

                showToast(`"${song.title}" foi baixado em MP3!`);
                refreshCardStates();
            }, 400);
        }

        function cancelDownload() {
            clearInterval(downloadInterval);
            downloadModal.classList.remove('active');
            showToast("Download cancelado");
        }

        function deleteSong(id) {
            downloadedSongs = downloadedSongs.filter(song => song.id !== id);
            localStorage.setItem('downloaded_songs', JSON.stringify(downloadedSongs));
            updateLibraryUI();
            renderLibraryList();
            showToast("Música removida das baixadas");
        }

        function updateLibraryUI() {
            downloadCountEl.textContent = `(${downloadedSongs.length})`;
        }

        function showToast(msg) {
            const toastMsg = document.getElementById('toastMsg');
            toastMsg.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // Registro de Service Worker PWA e Prompt de Instalação
        function setupPWA() {
            let deferredPrompt;
            const pwaInstallBtn = document.getElementById('pwaInstallBtn');

            window.addEventListener('beforeinstallprompt', (e) => {
                e.preventDefault();
                deferredPrompt = e;
                pwaInstallBtn.style.display = 'flex';
            });

            pwaInstallBtn.addEventListener('click', () => {
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    deferredPrompt.userChoice.then((choiceResult) => {
                        if (choiceResult.outcome === 'accepted') {
                            pwaInstallBtn.style.display = 'none';
                        }
                        deferredPrompt = null;
                    });
                }
            });

            // Registrar Service Worker via Blob para funcionar offline em arquivo único
            if ('serviceWorker' in navigator) {
                const swCode = `
                    const CACHE_NAME = 'musicdown-v1';
                    self.addEventListener('install', (e) => {
                        e.waitUntil(
                            caches.open(CACHE_NAME).then((cache) => {
                                return cache.addAll(['./']);
                            })
                        );
                    });
                    self.addEventListener('fetch', (e) => {
                        e.respondWith(
                            caches.match(e.request).then((res) => res || fetch(e.request))
                        );
                    });
                `;
                const blob = new Blob([swCode], {type: 'application/javascript'});
                const swUrl = URL.createObjectURL(blob);
                navigator.serviceWorker.register(swUrl).catch(() => {});
            }
        }
    </script>
</body>
